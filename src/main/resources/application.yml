spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jpalab
    username: jpalab
    password: jpalab
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        # 기본은 배치 사이즈 없음 -> 순수 N+1을 그대로 보여주기 위함
        # (배치 사이즈 데모는 테스트에서 이 값만 별도로 override)

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.stat: debug
